[tools]
# node:sqlite with FTS5 carries the corpus and the whole search layer, and the
# kit is built for Node 26, so this is a floor, not a preference.
node = "26.11.1"

[tasks.corpus]
description = "Собрать корпус из выгрузки Telegram: mise run corpus <dump.json>"
run = "npm run corpus --"

[tasks.profile]
description = "Напечатать стиль-профиль (dm | group | longform | code | jsdoc)"
run = "npm run profile --"

[tasks.where]
description = "Показать, где лежит корпус"
run = "npm run where"

[tasks.check]
description = "Форматирование, линтер, типы и тесты"
run = ["npm run format:check", "npm run lint", "npm run typecheck", "npm test"]
