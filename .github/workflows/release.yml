name: Release

# A merge into main only updates the release PR. Merging that PR cuts a
# release, the release goes to npm and out to the projects server. A manual run
# deploys any release tag, e.g. to roll back.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v1.2.0. Empty deploys the newest main.
        required: false

# One release at a time; a new one does not cancel a build already under way.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: aimuzov/.github/.github/workflows/release.yml@v1

  check:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/check.yml

  # Skipped until npm access is set up. Turned on by the repository variable
  # `NPM_PUBLISH=true`; without the `NPM_TOKEN` secret it needs trusted publishing.
  publish:
    needs: [release, check]
    # `!cancelled()` rather than `always()`: the job runs when release and check
    # are skipped (a manual run), but a cancelled run does not publish.
    if: >-
      !cancelled() && vars.NPM_PUBLISH == 'true' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@aimuzov/thinks-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aimuzov/infra-mcp-kit/publish@v1
        with:
          ref: ${{ needs.release.outputs.tag }}
          npm-token: ${{ secrets.NPM_TOKEN }}

  # Skipped until the server is ready (key, clone in /srv, site in Caddy).
  # Turned on by the repository variable `DEPLOY_ENABLED=true`.
  deploy:
    needs: [release, check]
    if: >-
      !cancelled() && vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://thinks-mcp.aimuzov.online
    steps:
      - uses: aimuzov/infra-site-kit/deploy@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://thinks-mcp.aimuzov.online/health
          ref: ${{ needs.release.outputs.tag || inputs.tag }}
