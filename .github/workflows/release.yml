name: Release

# Мёрж в main только обновляет релизный PR. Мёрж этого PR выпускает релиз,
# релиз уходит в npm и на сервер. Ручной запуск публикует и деплоит любой
# релизный тег, например, чтобы откатиться.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: Publish candidate images without deploying
        type: boolean
        default: false
      tag:
        description: Release tag to publish and deploy, e.g. v1.2.0. Empty deploys the newest main.
        required: false

# Релизы идут по одному, новый не прерывает уже начатый деплой.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: aimuzov/.github/.github/workflows/release.yml@v1

  check:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/check.yml

  # Публикация идёт при переменной репозитория `NPM_PUBLISH=true`. Токен в секрете
  # `NPM_TOKEN` должен обходить 2FA, иначе npm попросит одноразовый код;
  # без секрета нужен trusted publishing.
  publish:
    needs: [release, check]
    # `!cancelled()`, а не `always()`: job идёт и при пропущенных release и check
    # (ручной запуск), но отменённый прогон не публикует.
    if: >-
      !cancelled() && vars.NPM_PUBLISH == 'true' &&
      (github.event_name == 'workflow_dispatch' && !inputs.build_only && inputs.tag != '' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@aimuzov/thinks-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aimuzov/infra-mcp-kit/publish@v3
        with:
          ref: ${{ needs.release.outputs.tag || inputs.tag }}
          npm-token: ${{ secrets.NPM_TOKEN }}

  # Пока сервер не готов (ключ, клон в /srv, сайт в Caddy), деплой пропускается.
  # Включается переменной репозитория `DEPLOY_ENABLED=true`.
  deploy:
    needs: [release, check]
    if: >-
      !cancelled() && vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FROM_GHCR != 'true' && !inputs.build_only &&
      (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://thinks-mcp.aimuzov.online
    steps:
      - uses: aimuzov/infra-site-kit/deploy@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://thinks-mcp.aimuzov.online/health
          ref: ${{ needs.release.outputs.tag || inputs.tag }}

  build-app:
    needs: [release, check]
    if: >-
      !cancelled() && (inputs.build_only || (vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FROM_GHCR == 'true' && (needs.release.outputs.tag || inputs.tag) != '' && (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')))
    permissions:
      contents: read
      packages: write
    uses: aimuzov/infra-ci/.github/workflows/build-image.yml@3e762ccf913fdea02f1e43312270c7a4a7e9d335
    with:
      ref: ${{ needs.release.outputs.tag || inputs.tag || github.sha }}
      dockerfile: deploy/Dockerfile

  deploy-registry:
    needs: [release, build-app]
    if: >-
      !cancelled() && !inputs.build_only && needs.build-app.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - id: request
        env:
          TAG: ${{ needs.release.outputs.tag || inputs.tag }}
          REVISION: ${{ needs.build-app.outputs.revision }}
          IMAGE_APP: ${{ needs.build-app.outputs.image }}
        run: |
          printf 'value=images %s %s %s\n' "$TAG" "$REVISION" "${IMAGE_APP##*@}" >> "$GITHUB_OUTPUT"
      - uses: aimuzov/infra-site-kit/deploy@v5
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://thinks-mcp.aimuzov.online/health
          ref: ${{ steps.request.outputs.value }}
