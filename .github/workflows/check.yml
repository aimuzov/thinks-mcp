name: Check

# On main the release workflow runs these checks before a release goes out, and
# branches are checked through their PR. A separate run on push would repeat
# the same commit.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: aimuzov/infra-mcp-kit/check@v1
